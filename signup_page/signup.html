<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Page</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <div class="container">
        <h1>Sign Up</h1>
        <form id="signup-form">
            <div class="form-group">
                <label for="first-name">First Name</label>
                <input type="text" id="first-name" class="input-field" placeholder="Enter your first name" required>
                <div class="error" id="first-name-error"></div>
            </div>

            <div class="form-group">
                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" class="input-field" placeholder="Enter your last name" required>
                <div class="error" id="last-name-error"></div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="input-field" placeholder="Enter your email" required>
                <div class="error" id="email-error"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="input-field" placeholder="Create a password" required>
                <div class="error" id="password-error"></div>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" class="input-field" placeholder="Confirm your password" required>
                <div class="error" id="confirm-password-error"></div>
            </div>

            <button type="submit" class="submit-btn" onclick="gotothepage()">Sign Up</button>
        </form>
        <a href="file:///C:/Users/surya/OneDrive/Attachments/Desktop/Createathon_project/first-page/f-p.html" class="back-btn">Back to Home</a>
    </div>

    <script src="signup.js"></script>
</body>
</html>
